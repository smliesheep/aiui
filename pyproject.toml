[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiui"
version = "0.1.0"
description = "Natural-language driven UI automation framework (Pytest + Selenium + DeepSeek + Pydantic + Allure)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "openai>=1.30",
    "selenium>=4.18",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "allure-pytest>=2.13"]

[project.scripts]
aiui = "aiui.cli:main"

[tool.setuptools.packages.find]
include = ["aiui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_classes = ["NoSuchTestClass"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
